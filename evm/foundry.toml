# foundry.lock is committed HERE so dependency versions are pinned for every checkout.
# ⚠ A LONE CLONE OF THIS REPO DOES NOT BUILD. The remappings below reach OUT OF TREE
# into a sibling `shared` checkout, so `~/Work/btr/{dex,shared}` (or any parent holding
# both) must exist. A fresh standalone clone fails with:
#   Error (6275): Source "../../shared/evm/src/libs/B64.sol" not found
# This is DELIBERATE: `shared` holds Solidity primitives (AccessControl, Treasury,
# Staking, GovToken, StakedAsset, Errors, Constants) consumed BY SOURCE, not as a
# published package — one compiled definition, upgraded in lockstep with dex + alm.
# Fix it by cloning `shared` as a sibling, NEVER by vendoring a copy of those files:
# a second copy silently forks the singletons the deployed system shares.
[profile.default]
src = "src"
out = "out"
libs = [".deps", "../../shared/evm"]
remappings = [
  "@btr-shared/=../../shared/evm/src/",
  "@btr-shared-test/=../../shared/evm/test/",
  "@btr-shared-script/=../../shared/evm/script/",
]
optimizer = true
optimizer_runs = 10000
via_ir = true
solc = "0.8.35"
evm_version = "prague"
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [{ access = "read-write", path = "./" }]

[profile.dev]
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read-write", path = "./" }]

[profile.debug]
optimizer = false
verbosity = 4

[fuzz]
runs = 256
max_test_rejects = 65536

[invariant]
runs = 256
depth = 15
fail_on_revert = false

[fmt]
tab_width = 2
line_length = 100
int_types = "long"
quote_style = "double"

[rpc_endpoints]
mainnet = "${ETH_RPC_URL}"
anvil = "http://localhost:8545"
# Chapel (BSC testnet 97) endpoint removed 2026-07-25: Sepolia is the only testnet.
sepolia = "https://ethereum-sepolia-rpc.publicnode.com"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }
