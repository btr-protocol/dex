# foundry.lock is committed HERE: this repo must build from a standalone clone.
[profile.default]
src = "src"
out = "out"
libs = [".deps", "../../shared/evm"]
remappings = [
  "@btr-shared/=../../shared/evm/src/",
  "@btr-shared-test/=../../shared/evm/test/",
  "@btr-shared-script/=../../shared/evm/script/",
]
optimizer = true
optimizer_runs = 10000
via_ir = true
solc = "0.8.35"
evm_version = "prague"
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [{ access = "read-write", path = "./" }]

[profile.dev]
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read-write", path = "./" }]

[profile.debug]
optimizer = false
verbosity = 4

[fuzz]
runs = 256
max_test_rejects = 65536

[invariant]
runs = 256
depth = 15
fail_on_revert = false

[fmt]
tab_width = 2
line_length = 100
int_types = "long"
quote_style = "double"

[rpc_endpoints]
mainnet = "${ETH_RPC_URL}"
anvil = "http://localhost:8545"
# Chapel (BSC testnet 97) endpoint removed 2026-07-25: Sepolia is the only testnet.
sepolia = "https://ethereum-sepolia-rpc.publicnode.com"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }
