# BTR DEX Backend Services Stack
#
# Configuration: Copy back/.env.example to back/.env and set your values
#
# Usage:
#   docker compose up -d                    # Start agents + collector (no TEI)
#   docker compose --profile tei up -d      # Start full stack with TEI
#   docker compose down                     # Stop all services
#
# TEI Note: The TEI service requires network access to download models from
# HuggingFace on first start. If you have network issues, agents will still
# work with TEI_EXTERNAL=true (lexical search only, no semantic search).

# Load environment variables from back/.env
env_file:
  - back/.env

services:
  # Text Embeddings Inference for semantic search (optional)
  # Uses EmbeddingGemma ONNX (768D) - SOTA model, quantized for CPU efficiency
  # Clone model first for reliability: git clone https://huggingface.co/onnx-community/embeddinggemma-300m-ONNX
  tei:
    profiles: ["tei", "full"]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    command:
      - --model-id=/data
      - --pooling=mean
    ports:
      - "8080:80"
    volumes:
      # Mount local q4 model directory (prepared by dev.ts or pre-built)
      - ./back/services/agents/src/search/semantic/.tei-model:/data
    environment:
      # HF_TOKEN for future use (local model doesn't need it)
      - HF_TOKEN=${HF_TOKEN}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 180s
    restart: unless-stopped

  # Agents service (RAG + Chat)
  agents:
    build:
      context: .
      dockerfile: Dockerfile.back
      target: agents-runner
    image: btr-agents:latest
    ports:
      - "4001:4001"
    environment:
      - NODE_ENV=production
      - PORT=4001
      - DATA_DIR=/app/back/.data
      - TEI_URL=${TEI_URL:-http://tei}
      - TEI_PORT=${TEI_PORT:-80}
      - TEI_MODEL=${TEI_MODEL:-onnx-community/embeddinggemma-300m-ONNX}
      - TEI_EXTERNAL=true
      - ZAI_API_KEY=${ZAI_API_KEY:-}
      - ZAI_BASE_URL=${ZAI_BASE_URL:-https://api.z.ai/api/coding/paas/v4}
      - ZAI_MODEL_ENHANCEMENT=${ZAI_MODEL_ENHANCEMENT:-glm-4.5-airx}
      - ZAI_MODEL_REASONING=${ZAI_MODEL_REASONING:-glm-4.7}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-in-production}
      - GENESIS_INVITE_CODE=${GENESIS_INVITE_CODE:-BTRNOW}
      - ADMIN_WALLETS=${ADMIN_WALLETS:-}
      - CORS_ENABLED=${CORS_ENABLED:-true}
      - RATE_LIMIT_PER_SESSION=${RATE_LIMIT_PER_SESSION:-60}
    volumes:
      - agents-data:/app/back/.data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4001/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Collector service (market data)
  collector:
    build:
      context: .
      dockerfile: Dockerfile.back
      target: collector-runner
    image: btr-collector:latest
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - DATA_DIR=${DATA_DIR:-/app/data}
      - RPC_URL=${RPC_URL:-}
      - POOL_ZERO_ADDRESS=${POOL_ZERO_ADDRESS:-}
      - POOL_STABLE_ADDRESS=${POOL_STABLE_ADDRESS:-}
    volumes:
      - collector-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  agents-data:
  collector-data:
