[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
via_ir = true
solc_version = "0.8.33"

[profile.dev]
optimizer = true
optimizer_runs = 200
via_ir = false
# Allow tests to write CSV output files
fs_permissions = [{ access = "read-write", path = "./"}]

remappings = [
    "forge-std/=lib/forge-std/src/",
    "solady/=lib/solady/src/",
]

[fuzz]
runs = 256
max_test_rejects = 65536

[invariant]
runs = 256
depth = 15
fail_on_revert = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
mainnet = "${ETH_RPC_URL}"
anvil = "http://localhost:8545"
