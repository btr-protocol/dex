# AMM Simulation Configuration
# This file defines all parameters for comparing multiple AMM implementations

# General simulation configuration
simulation:
    series_factory:
        start: 2024-01-01T00:00:00Z
        end: 2024-02-01T00:00:00Z
        timeframe: s10 # time interval for price data and trades (the lower, the more accurate)
        source: binance # binance, coinbase, or generative
        quote: USDT

# Liquidity configuration shared across all AMMs
# Each AMM gets the same initial liquidity to ensure fair comparison
liquidity:
    reserves_usd: # initial liquidity reserves in each AMM
        USDC: 1000000 # value at start of simulation
        USDT: 1000000
        WBTC: 1000000
        WETH: 1000000
    daily_utilization: 2 # 200% of liquidity is traded every day across all AMMs

# Competing AMMs configurations
amms:
    - name: Uniswap V2 (Multi-CPMM)
      type: uniswap_v2
      pools:
        - tokens: [USDC, WBTC]
          params:
            fee: 0.001
        - tokens: [USDC, WETH]
          params:
            fee: 0.001
        - tokens: [USDC, USDT]
          params:
            fee: 0.0001

    - name: Uniswap V4 (Multi-CLMM, naive bonded)
      type: uniswap_v3
      pools:
        - tokens: [USDC, WBTC]
          params:
            fee: 0.001
            tick_spacing: 10
            range_breadth: 0.1
            rebalance:
              strategy: naive_bonded
              params: [2]
        - tokens: [USDC, WETH]
          params:
            fee: 0.001
            tick_spacing: 10
            range_breadth: 0.1
            rebalance:
              strategy: naive_bonded
              params: [2]
        - tokens: [USDC, USDT]
          params:
            fee: 0.00005
            tick_spacing: 1
            range_breadth: 0.005
            rebalance:
              strategy: naive_bonded
              params: [2]

    - name: BTR V1 (Single-AIMM)
      type: aimm
      pools:
        - tokens: [USDC, USDT, WBTC, WETH]
          params:
            base_token: USDC
            assets:
              USDC:
                min_fee: 0.000002
                max_fee: 0.02
              USDT:
                min_fee: 0.000002
                max_fee: 0.02
                price_anchor: USDC
                min_dispersion: 0.00002
                max_dispersion: 0.1
                gamma: 2
                vega: 0.5
                lambda: 0.1
                haircut_suppressor: 0.5
                reservation_price: 0.9
              WBTC:
                min_fee: 0.00025
                max_fee: 0.03
                min_dispersion: 0.0001
                max_dispersion: 0.3
                gamma: 2
                vega: 0.5
                lambda: 0.1
                haircut_suppressor: 0.5
                reservation_price: 0
              WETH:
                min_fee: 0.00025
                max_fee: 0.03
                min_dispersion: 0.0001
                max_dispersion: 0.3
                gamma: 2
                vega: 0.5
                lambda: 0.1
                haircut_suppressor: 0.5
                reservation_price: 0

# Trader configuration
traders:
    daily_volume: auto # auto or explicit USD value
    toxicity:
      base: 0.25 # base proportion of toxic volume
      factor: power_law # linear or power_law
    weights: # routing weight for each token
        USDC: 0.5
        USDT: 0.25
        WBTC: 0.25
        WETH: 0.5
