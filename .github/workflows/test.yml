# ⚠ MUST live at the REPO ROOT. This file was at `evm/.github/workflows/test.yml`
# until 2026-07-25, where GitHub Actions never reads it — Actions only discovers
# workflows under `<repo-root>/.github/workflows`. dex, the primary product, had
# had no running CI while the archived alm repo did.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  evm:
    name: Foundry project
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dex/evm
    steps:
      # evm remaps `@btr-shared/` to `../../shared/evm/src/`, so the sibling
      # checkout layout is not optional: without it forge cannot resolve a source.
      - uses: actions/checkout@v4
        with:
          path: dex
      - uses: actions/checkout@v4
        with:
          repository: btr-protocol/shared
          path: shared

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      # build + test FIRST: they are the signal worth having on run one.
      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv

      # Blocking. Clears only once the in-flight ExternalOracle/PoolAux/
      # PoolLiquidity drift lands formatted. Do NOT clear it with an unattended
      # `forge fmt`: fmt collapses braces on single-line if/for/while bodies,
      # turning a guarded second statement into an unconditional one, and three
      # of the drifting files are on the money path. Pre-expand one-line
      # control-flow bodies, then fmt, then read the whole diff.
      - name: Run Forge fmt
        run: forge fmt --check

  sim:
    name: AIMM sim (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dex/sim
    steps:
      # Same sibling layout as the evm job: tests/solidity_parity.rs reads the
      # real .sol sources, including ../../shared/evm/src/Constants.sol.
      - uses: actions/checkout@v4
        with:
          path: dex
      - uses: actions/checkout@v4
        with:
          repository: btr-protocol/shared
          path: shared

      - name: Check formatting
        run: cargo fmt --check

      - name: Build
        run: cargo build --all-targets

      # solidity_parity re-reads Pricing.sol / NUQuartic.sol / Constants.sol and
      # fails when a constant or the keeper-grace formula drifts from
      # sim/src/amm/consts.rs. This is the gate that keeps the reference model
      # honest; sim/tape (real bar tapes, needs a private sibling repo) stays
      # out of CI on purpose.
      - name: Run parity + unit tests
        run: cargo test --all-targets
