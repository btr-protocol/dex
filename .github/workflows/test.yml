# ⚠ MUST live at the REPO ROOT. This file was at `evm/.github/workflows/test.yml`
# until 2026-07-25, where GitHub Actions never reads it — Actions only discovers
# workflows under `<repo-root>/.github/workflows`. dex, the primary product, had
# had no running CI while the archived alm repo did.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      # build + test FIRST: they are the signal worth having on run one.
      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv

      # ⚠ NON-BLOCKING, deliberately and temporarily. `forge fmt --check` fails
      # today on 8 files of PRE-EXISTING drift (ExternalOracle.sol, PoolAux.sol,
      # PoolLiquidity.sol, 3 tests, 2 scripts) that accumulated over however long
      # this workflow sat at evm/.github/ where Actions never read it. Blocking on
      # it would mean run one goes red on formatting and reports NO build or test
      # result, which is the opposite of what turning CI on is for.
      #
      # Do NOT fix this by running `forge fmt` over the tree unattended: fmt
      # collapses braces on single-line if/for/while bodies, which turns a guarded
      # second statement into an unconditional one. Three of the drifting files are
      # on the money path (ExternalOracle, PoolAux, PoolLiquidity). The procedure is
      # to pre-expand one-line control-flow bodies, then fmt, then read the whole
      # diff — and that lands with a security review, not here.
      #
      # Flip continue-on-error off in the same commit that clears the drift.
      - name: Run Forge fmt
        run: forge fmt --check
        continue-on-error: true
