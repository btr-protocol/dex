# ⚠ MUST live at the REPO ROOT. This file was at `evm/.github/workflows/test.yml`
# until 2026-07-25, where GitHub Actions never reads it — Actions only discovers
# workflows under `<repo-root>/.github/workflows`. dex, the primary product, had
# had no running CI while the archived alm repo did.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv
